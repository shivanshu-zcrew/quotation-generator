server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html (and the version.json it's paired with) must always be
    # revalidated — it's what points the browser at the current build's
    # hashed JS/CSS chunk filenames. Without this, a browser or intermediate
    # cache can keep serving a stale index.html indefinitely, permanently
    # pinning that tab to a pre-fix frontend build regardless of how many
    # times the app is redeployed.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vite fingerprints JS/CSS filenames with a content hash, so a changed
    # file is always a new URL — safe to cache aggressively/forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}