services:
  frontend:
    build:
      context: ./frontend/quotation
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    # Docker's default json-file driver has no size cap — without this,
    # container logs grow unbounded on the host disk indefinitely.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/logs:/app/logs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"