services:
  frontend:
    build:
      context: ./frontend/quotation
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    # Docker's default json-file driver has no size cap — without this,
    # container logs grow unbounded on the host disk indefinitely.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    # PID 1 is `npm start`, which doesn't reap orphaned children — without an
    # init process, crashed/killed Chromium helpers pile up as zombies.
    init: true
    volumes:
      - ./backend/logs:/app/logs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"